name: Applications validation

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applications-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Refuse platform paths and empty chart shells
        run: |
          set -euo pipefail
          test ! -d infrastructure
          test ! -d charts/cluster-apps
          if compgen -G 'charts/*/Chart.yaml' > /dev/null; then
            for chart in charts/*/Chart.yaml; do
              dir="$(dirname "$chart")"
              test -f "$dir/values.yaml"
            done
          fi
